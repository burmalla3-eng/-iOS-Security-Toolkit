name: iOSSecurityToolkit

options:
  bundleIdPrefix: com.securitytoolkit
  deploymentTarget:
    iOS: "15.0"

targets:
  iOSSecurityToolkit:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securitytoolkit.iossecuritytoolkit
        PRODUCT_NAME: iOSSecurityToolkit
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        GENERATE_INFOPLIST_FILE: YES